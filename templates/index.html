{% extends "base.html" %}

{% block title %}Dashboard - Svengalibot{% endblock %}

{% block content %}
<div class="dashboard">
    <section class="new-task">
        <h2>New Task</h2>
        <form id="new-task-form">
            <textarea id="task-description" placeholder="Describe what you want to build..." rows="4"></textarea>
            <button type="submit">Create Task</button>
        </form>
    </section>

    <section class="task-list">
        <h2>Tasks</h2>
        <div id="tasks-container">
            <p class="empty-state">No tasks yet. Create one above.</p>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('new-task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const description = document.getElementById('task-description').value;
    if (!description.trim()) return;

    const response = await fetch('/task', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({description})
    });

    if (response.ok) {
        const data = await response.json();
        window.location.href = '/task/' + data.id;
    }
});

async function loadTasks() {
    const response = await fetch('/tasks');
    const data = await response.json();
    const container = document.getElementById('tasks-container');

    if (data.tasks.length === 0) {
        container.innerHTML = '<p class="empty-state">No tasks yet. Create one above.</p>';
        return;
    }

    container.innerHTML = data.tasks.map(task => `
        <a href="/task/${task.id}" class="task-card">
            <span class="status status-${task.status}">${task.status}</span>
            <span class="description">${task.description.substring(0, 100)}...</span>
            <span class="progress">${task.completed_chunks || 0}/${task.total_chunks || 0} chunks</span>
        </a>
    `).join('');
}

loadTasks();
</script>
{% endblock %}
