{% extends "base.html" %}

{% block title %}Task - {{ project_name }}{% endblock %}

{% block content %}
<div class="chat-layout">
    <!-- Sidebar with file explorer -->
    <div class="chat-sidebar">
        <div class="sidebar-header">
            <a href="/project/{{ project_name }}" class="back-link">&larr; {{ project_name }}</a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Files <button id="btn-refresh-files" class="btn-icon" title="Refresh">↻</button></div>
            <div id="file-tree" class="file-tree-mini"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Status</div>
            <div class="status-info">
                <div class="status-row">
                    <span>Status:</span>
                    <span id="task-status" class="status status-pending">pending</span>
                </div>
                <div class="status-row">
                    <span>Iteration:</span>
                    <span id="iteration-count">0 / 10</span>
                </div>
            </div>
        </div>
        <div class="sidebar-controls">
            <button id="btn-pause" class="btn-secondary btn-full">Pause</button>
            <button id="btn-resume" class="btn-secondary btn-full" style="display:none">Resume</button>
            <button id="btn-stop" class="btn-danger btn-full">Stop</button>
        </div>
    </div>

    <!-- Main chat area -->
    <div class="chat-main">
        <!-- Collaboration prompt header -->
        <div class="chat-header">
            <div class="prompt-display" id="prompt-display">
                <div class="prompt-label">Collaboration Prompt</div>
                <div class="prompt-text" id="prompt-text"></div>
            </div>
        </div>

        <!-- Chat messages -->
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be inserted here -->
        </div>

        <!-- Input area (for manual intervention if needed) -->
        <div class="chat-input" id="chat-input" style="display:none">
            <textarea id="user-input" placeholder="Send a message to intervene..." rows="2"></textarea>
            <button id="btn-send" class="btn-primary">Send</button>
        </div>
    </div>
</div>

<!-- File viewer modal -->
<div id="file-modal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
        <div class="modal-header">
            <span id="file-modal-title">File</span>
            <button class="modal-close" onclick="closeFileModal()">&times;</button>
        </div>
        <div class="modal-body">
            <pre id="file-content"><code></code></pre>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Marked.js for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const projectName = '{{ project_name }}';
const taskId = '{{ task_id }}';
let currentTask = null;
let displayedMessageIds = new Set(); // Track displayed messages to avoid duplicates
let streamingMessageEl = null; // Current streaming message element

// Configure marked for safe rendering
marked.setOptions({
    breaks: true,
    gfm: true,
});

// Load task and connect to stream
async function loadTask() {
    const response = await fetch(`/project/${projectName}/chat/${taskId}/json`);
    if (!response.ok) {
        alert('Task not found');
        window.location.href = `/project/${projectName}`;
        return;
    }
    currentTask = await response.json();
    updateUI(currentTask);
}

function updateUI(task) {
    // Update status
    const statusEl = document.getElementById('task-status');
    statusEl.textContent = task.status;
    statusEl.className = `status status-${task.status}`;

    // Update iteration
    document.getElementById('iteration-count').textContent =
        `${task.iteration || 0} / ${task.max_iterations || 10}`;

    // Update prompt
    document.getElementById('prompt-text').textContent = task.prompt || task.description || '';

    // Update controls
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');

    if (task.status === 'paused' || task.status === 'awaiting_approval') {
        btnPause.style.display = 'none';
        btnResume.style.display = 'block';
    } else if (task.status === 'completed' || task.status === 'failed' || task.status === 'done') {
        btnPause.style.display = 'none';
        btnResume.style.display = 'none';
    } else {
        btnPause.style.display = 'block';
        btnResume.style.display = 'none';
    }

    // Render messages (only new ones)
    if (task.messages) {
        for (const msg of task.messages) {
            const msgId = msg.timestamp + '_' + msg.role;
            if (!displayedMessageIds.has(msgId)) {
                appendMessage(msg);
                displayedMessageIds.add(msgId);
            }
        }
    }
}

function renderMessage(msg) {
    const roleClass = msg.role || 'system';
    const provider = msg.provider || roleClass;
    const icon = getProviderIcon(provider);
    const label = getProviderLabel(provider, msg.role);
    const msgId = msg.timestamp + '_' + msg.role;

    return `
        <div class="chat-message ${roleClass}" data-msg-id="${msgId}">
            <div class="message-header">
                <span class="message-icon">${icon}</span>
                <span class="message-label">${label}</span>
                <span class="message-time">${formatTime(msg.timestamp)}</span>
            </div>
            <div class="message-content markdown-body">${formatContent(msg.content, msg.role)}</div>
        </div>
    `;
}

function appendMessage(msg) {
    const container = document.getElementById('chat-messages');
    const msgId = msg.timestamp + '_' + msg.role;

    // Don't add duplicates
    if (displayedMessageIds.has(msgId)) return;
    displayedMessageIds.add(msgId);

    container.insertAdjacentHTML('beforeend', renderMessage(msg));
    container.scrollTop = container.scrollHeight;

    // Clear streaming reference if this is a complete message
    streamingMessageEl = null;
}

function startStreamingMessage(role, provider) {
    const container = document.getElementById('chat-messages');
    const msg = {
        role: role,
        provider: provider,
        content: '',
        timestamp: new Date().toISOString(),
    };

    container.insertAdjacentHTML('beforeend', renderMessage(msg));
    streamingMessageEl = container.querySelector('.chat-message:last-child .message-content');
    container.scrollTop = container.scrollHeight;

    return streamingMessageEl;
}

function appendToStreamingMessage(content) {
    if (streamingMessageEl) {
        // Append raw text, we'll format when complete
        streamingMessageEl.textContent += content;
        const container = document.getElementById('chat-messages');
        container.scrollTop = container.scrollHeight;
    }
}

function finalizeStreamingMessage() {
    if (streamingMessageEl) {
        // Re-render with markdown
        const text = streamingMessageEl.textContent;
        streamingMessageEl.innerHTML = formatContent(text, 'worker');
        streamingMessageEl = null;
    }
}

function getProviderIcon(provider) {
    const icons = {
        'claude': '🤖',
        'openai': '🧠',
        'user': '👤',
        'system': '⚙️',
        'worker': '🤖',
        'reviewer': '🧠',
    };
    return icons[provider] || '💬';
}

function getProviderLabel(provider, role) {
    if (provider === 'claude' || role === 'worker') return 'Claude (Worker)';
    if (provider === 'openai' || role === 'reviewer') return 'OpenAI (Reviewer)';
    if (provider === 'user' || role === 'user') return 'You';
    return 'System';
}

function formatTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatContent(content, role) {
    if (!content) return '';

    // Use marked.js for markdown rendering
    try {
        // Sanitize by escaping HTML first, then parse markdown
        let html = marked.parse(content);
        return html;
    } catch (e) {
        // Fallback to basic escaping
        const div = document.createElement('div');
        div.textContent = content;
        return div.innerHTML.replace(/\n/g, '<br>');
    }
}

// SSE Connection
function connectStream() {
    const evtSource = new EventSource(`/project/${projectName}/chat/${taskId}/stream`);

    evtSource.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            handleStreamEvent(data);
        } catch (e) {
            console.error('Failed to parse event:', e);
        }
    };

    evtSource.onerror = () => {
        console.log('Stream connection lost, reconnecting...');
        evtSource.close();
        setTimeout(connectStream, 3000);
    };
}

function handleStreamEvent(data) {
    switch (data.type) {
        case 'state':
            if (data.task) updateUI(data.task);
            break;

        case 'message':
            // New complete message - finalize any streaming first
            finalizeStreamingMessage();
            appendMessage(data.data);
            break;

        case 'message_chunk':
            // Streaming chunk - append to last message
            appendToStreamingMessage(data.data.content);
            break;

        case 'worker_started':
            // Start a new streaming message for worker
            finalizeStreamingMessage();
            startStreamingMessage('worker', 'claude');
            break;

        case 'chunk_output':
            // Worker output streaming
            if (!streamingMessageEl) {
                startStreamingMessage('worker', 'claude');
            }
            appendToStreamingMessage(data.data?.content || '');
            break;

        case 'chunk_reviewing':
            finalizeStreamingMessage();
            appendMessage({
                role: 'system',
                provider: 'system',
                content: '🔍 OpenAI is reviewing...',
                timestamp: new Date().toISOString(),
            });
            break;

        case 'chunk_approved':
            appendMessage({
                role: 'reviewer',
                provider: 'openai',
                content: '✅ **Approved:** ' + (data.data?.notes || 'Work looks good!'),
                timestamp: new Date().toISOString(),
            });
            updateIterationCount();
            break;

        case 'chunk_rejected':
            const review = data.data?.review || {};
            appendMessage({
                role: 'reviewer',
                provider: 'openai',
                content: '❌ **Changes requested:**\n\n' + (review.feedback_for_retry || review.summary || 'Please revise.'),
                timestamp: new Date().toISOString(),
            });
            updateIterationCount();
            break;

        case 'flow_iteration':
            document.getElementById('iteration-count').textContent =
                `${data.data?.iteration || 0} / ${data.data?.max_iterations || 10}`;
            break;

        case 'task_completed':
            finalizeStreamingMessage();
            appendMessage({
                role: 'system',
                provider: 'system',
                content: '🎉 **Task completed successfully!**',
                timestamp: new Date().toISOString(),
            });
            loadTask();
            loadFileTree(); // Refresh files
            break;

        case 'task_paused':
            finalizeStreamingMessage();
            appendMessage({
                role: 'system',
                provider: 'system',
                content: '⏸️ Task paused. ' + (data.data?.message || ''),
                timestamp: new Date().toISOString(),
            });
            loadTask();
            break;

        case 'task_failed':
        case 'error':
            finalizeStreamingMessage();
            appendMessage({
                role: 'system',
                provider: 'system',
                content: '❌ **Error:** ' + (data.data?.error || 'Unknown error'),
                timestamp: new Date().toISOString(),
            });
            loadTask();
            break;

        case 'usage_update':
            // Could show cost badge here
            break;

        case 'heartbeat':
        case 'connected':
            break;

        default:
            console.log('Unhandled event:', data.type, data);
    }
}

function updateIterationCount() {
    const el = document.getElementById('iteration-count');
    const parts = el.textContent.split(' / ');
    const current = parseInt(parts[0]) + 1;
    el.textContent = `${current} / ${parts[1]}`;
}

// Controls
document.getElementById('btn-pause').addEventListener('click', async () => {
    await fetch(`/project/${projectName}/chat/${taskId}/pause`, { method: 'POST' });
    loadTask();
});

document.getElementById('btn-resume').addEventListener('click', async () => {
    await fetch(`/project/${projectName}/chat/${taskId}/resume`, { method: 'POST' });
    loadTask();
});

document.getElementById('btn-stop').addEventListener('click', async () => {
    if (confirm('Stop this task?')) {
        await fetch(`/project/${projectName}/chat/${taskId}/cancel`, { method: 'POST' });
        loadTask();
    }
});

// File tree
async function loadFileTree() {
    try {
        const response = await fetch(`/project/${projectName}/files`);
        const data = await response.json();
        renderFileTree(data.tree, document.getElementById('file-tree'), 0);
    } catch (e) {
        console.error('Failed to load files:', e);
    }
}

function renderFileTree(items, container, depth) {
    if (!items || items.length === 0) {
        if (depth === 0) {
            container.innerHTML = '<div class="empty-state">No files yet</div>';
        }
        return;
    }

    // Clear container for top level
    if (depth === 0) {
        container.innerHTML = '';
    }

    // Limit items shown
    const maxItems = depth === 0 ? 30 : 20;
    const displayItems = items.slice(0, maxItems);

    for (const item of displayItems) {
        const div = document.createElement('div');
        div.className = 'file-item' + (item.type === 'directory' ? ' directory' : '');
        div.style.paddingLeft = (8 + depth * 12) + 'px';

        const icon = item.type === 'directory' ? '📁' : getFileIcon(item.extension);
        div.innerHTML = `<span class="file-icon">${icon}</span><span class="file-name">${item.name}</span>`;

        if (item.type === 'file') {
            div.onclick = () => openFile(item.path);
            div.style.cursor = 'pointer';
        } else if (item.type === 'directory' && item.children) {
            div.onclick = (e) => {
                e.stopPropagation();
                toggleDirectory(div, item.children, depth + 1);
            };
            div.style.cursor = 'pointer';
        }

        container.appendChild(div);

        // Render children if expanded by default
        if (item.type === 'directory' && item.children && item.expanded) {
            const childContainer = document.createElement('div');
            childContainer.className = 'file-children';
            container.appendChild(childContainer);
            renderFileTree(item.children, childContainer, depth + 1);
        }
    }

    if (items.length > maxItems) {
        const more = document.createElement('div');
        more.className = 'file-item muted';
        more.style.paddingLeft = (8 + depth * 12) + 'px';
        more.textContent = `...and ${items.length - maxItems} more`;
        container.appendChild(more);
    }
}

function toggleDirectory(el, children, depth) {
    const nextEl = el.nextElementSibling;
    if (nextEl && nextEl.classList.contains('file-children')) {
        // Collapse
        nextEl.remove();
        el.querySelector('.file-icon').textContent = '📁';
    } else {
        // Expand
        el.querySelector('.file-icon').textContent = '📂';
        const childContainer = document.createElement('div');
        childContainer.className = 'file-children';
        el.after(childContainer);
        renderFileTree(children, childContainer, depth);
    }
}

async function openFile(path) {
    try {
        const response = await fetch(`/project/${projectName}/file?path=${encodeURIComponent(path)}`);
        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        document.getElementById('file-modal-title').textContent = path;
        const codeEl = document.querySelector('#file-content code');
        codeEl.textContent = data.content;
        codeEl.className = 'language-' + (data.extension || 'text');

        // Highlight if hljs available
        if (window.hljs) {
            hljs.highlightElement(codeEl);
        }

        document.getElementById('file-modal').style.display = 'flex';
    } catch (e) {
        console.error('Failed to load file:', e);
        alert('Failed to load file');
    }
}

function closeFileModal() {
    document.getElementById('file-modal').style.display = 'none';
}

// Close modal on outside click
document.getElementById('file-modal').addEventListener('click', (e) => {
    if (e.target.id === 'file-modal') {
        closeFileModal();
    }
});

// Escape key closes modal
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeFileModal();
    }
});

function getFileIcon(ext) {
    const icons = {
        'py': '🐍',
        'js': '📜',
        'ts': '📘',
        'md': '📝',
        'json': '📋',
        'html': '🌐',
        'css': '🎨',
        'yaml': '⚙️',
        'yml': '⚙️',
        'txt': '📄',
        'sh': '💻',
    };
    return icons[ext] || '📄';
}

// Refresh files button
document.getElementById('btn-refresh-files').addEventListener('click', loadFileTree);

// Initialize
loadTask();
loadFileTree();
connectStream();
</script>

<style>

.markdown-body {
    line-height: 1.5;
}
.markdown-body h1, .markdown-body h2, .markdown-body h3 {
    margin-top: 0.5em;
    margin-bottom: 0.3em;
    font-weight: 600;
}
.markdown-body h1 { font-size: 1.4em; }
.markdown-body h2 { font-size: 1.2em; }
.markdown-body h3 { font-size: 1.1em; }
.markdown-body p {
    margin: 0.4em 0;
}
.markdown-body ul, .markdown-body ol {
    margin: 0.3em 0;
    padding-left: 1.5em;
}
.markdown-body li {
    margin: 0.2em 0;
}
.markdown-body code {
    background: rgba(0,0,0,0.1);
    padding: 0.1em 0.3em;
    border-radius: 3px;
    font-size: 0.9em;
}
.markdown-body pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 0.8em;
    border-radius: 4px;
    overflow-x: auto;
    margin: 0.5em 0;
}
.markdown-body pre code {
    background: none;
    padding: 0;
    color: inherit;
}
.markdown-body blockquote {
    border-left: 3px solid #666;
    margin: 0.5em 0;
    padding-left: 1em;
    color: #888;
}
.markdown-body strong {
    font-weight: 600;
}

/* File tree improvements */
.file-item {
    padding: 4px 8px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85em;
}
.file-item:hover {
    background: rgba(255,255,255,0.1);
}
.file-item.directory {
    font-weight: 500;
}
.file-children {
    /* Nested files */
}
.file-icon {
    flex-shrink: 0;
}
.file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* File modal */

    max-width: 900px;
    width: 90%;
}
#file-content {
    max-height: 70vh;
    overflow: auto;
    margin: 0;

    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    padding: 2px 6px;
    font-size: 0.9em;
    opacity: 0.7;
}

    opacity: 1;
}
</style>
{% endblock %}
