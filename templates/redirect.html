<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="3;url={{ redirect_url }}">
    <title>Redirecting - Svengalibot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .message {
            text-align: center;
            padding: 2rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        h1 { color: #d29922; }
        a { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="message">
        <h1>URL Changed</h1>
        <p>{{ message }}</p>
        <p>Redirecting to <a href="{{ redirect_url }}">dashboard</a> in 3 seconds...</p>
        <p><small>Or <a href="{{ redirect_url }}">click here</a> to go now.</small></p>
    </div>
</body>
</html>
